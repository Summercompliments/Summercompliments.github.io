<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compliment & Fortune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-layer">
  <div class="bg-gradient"></div>
  <div class="bg-orb a"></div>
  <div class="bg-orb b"></div>
  <div class="bg-stars"></div>
</div>

<div class="app">
  <header class="top">
    <div>
      <div class="wordmark">✧ Compliment & Fortune ✧</div>
      <div class="stars">· · ·</div>
    </div>
  </header>

  <!-- STEP 1 + 2 combined view -->
  <section id="view-upload" class="active">
    <div class="card"><div class="card-inner">
      <div class="eyebrow">A Reading, Just For You</div>
      <h1 class="headline">Show us your light.</h1>
      <p class="sub">Choose a photo from your library to get a compliment and a fortune.</p>

      <div class="field">
        <label for="photoInput">Step 1 — Your photo</label>
        <label class="photo-drop" id="dropZone" for="photoInput">
          <span class="placeholder" id="dropPlaceholder">Tap to choose a photo from your library</span>
        </label>
        <input type="file" id="photoInput" accept="image/*">
      </div>

      <div id="stepTwo" style="display:none;">
        <div class="field">
          <label for="capInput">A little about you / this moment (optional)</label>
          <textarea id="capInput" maxlength="220" placeholder="Whatever feels true right now"></textarea>
        </div>

        <button class="btn rose" id="submitBtn">I'm 18+ and I consent to my photo &amp; note being processed and shared with the organizer — Reveal my reading</button>
      </div>
    </div></div>
  </section>

  <!-- REVEAL -->
  <section id="view-reveal">
    <div class="card"><div class="card-inner">
      <div class="eyebrow">Your Reading</div>
      <h1 class="headline" style="font-size:24px;">✧ Revealed ✧</h1>

      <div class="reveal-label">Compliment</div>
      <p class="reveal-text" id="complimentText">—</p>

      <div class="divider"><span>☾</span></div>

      <div class="reveal-label">Fortune</div>
      <p class="reveal-text" id="fortuneText">—</p>

      <button class="btn secondary" id="againBtn" style="margin-top:18px;">Get another reading</button>
    </div></div>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
